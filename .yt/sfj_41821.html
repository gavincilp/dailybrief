  <script type="text/javascript">
    $(function () {
      // 判断是否老年模式
      if ($.cookie("older-model") == "true") {
        // console.log($.cookie("older-model"));
        $(".main-body").addClass("older-model");
        $("#olderModel").html("退出老年模式");
      } else {
        // console.log($.cookie("older-model"));
        $(".main-body").removeClass("older-model");
        $("#olderModel").html("进入老年模式");
      }
      //
      var currentColumn = $(".current-column").html();
      $(".left-nav-list li.item").removeClass("active");
      $(".left-nav-list li.item").each(function(){
        if ($(this).attr("data-column") == currentColumn){
          $(this).addClass("active");
        } else {
          $(this).removeClass("active");
        }
      });
      //尺寸变更
      function debounce(fn, delay) {
        var timer = null;
        return function () {
          var context = this;
          var args = arguments;

          clearTimeout(timer);
          timer = setTimeout(function () {
            fn.apply(context, args);
          }, delay)
        }
      }

      function foo() {
        // debugger;
        var windows_W = $(window).width();
        var container_w = $(".container").width();
        var windows_H = $(window).height();

        if (windows_W <= 768) {
          $(".main-body").removeClass("older-model");
          $("#olderModel").hide();
        } else {
          $("#olderModel").show();
          if ($.cookie("older-model") == "true") {
            $(".main-body").addClass("older-model");
          } else {
            $(".main-body").removeClass("older-model");
          }
        }

        var footer_h = $(".bottom-container").outerHeight();
        $(".main-body").css("padding-bottom", footer_h + "px");
      }
      foo();
      window.addEventListener("resize", debounce(foo, 1000));

      //
      $("#olderModel").click(function () {
        if ($.cookie("older-model") == "true") {
          $.cookie("older-model", false);
          $(".main-body").removeClass("older-model");
          $("#olderModel").html("进入老年模式");
          foo();
        } else {
          $.cookie("older-model", true);
          $(".main-body").addClass("older-model");
          $("#olderModel").html("退出老年模式");
          foo();
        }
        window.location.reload();
      });
    })
  </script>

    $(function () {
        // 判断老年版和普通版
        var storage = window.localStorage;
        // 获取浏览器页面宽度
        var clientWidth = $("html").outerWidth();
        // 判断localstorage存储中是否含有key为mode，true则是老年版，添加老年版class类名old_type
        if (storage.hasOwnProperty("mode")) {
            // $("body").addClass("old_type");
            old_xgk();
            nbchanges();
        } else {
            // $("body").removeClass("old_type");
        }
        // 进入老年版按钮点击，创建存储键值，并在body添加class类名
        $(".new_boount").click(function () { // 进入老年版按钮点击
            $("body").addClass("old_type");
            storage.setItem("mode", 2);
            old_xgk();
        });
        // 退出老年版按钮点击，删除存储键值，并移除body的class类名
        $(".old_boount").click(function () {
            $("body").removeClass("old_type");
            storage.removeItem("mode");
            tcold_xgk();
            $('#gd_1 iframe').eq(0).attr('src', $('#gd_1 iframe').eq(0).attr('src'))
            $('.three_list iframe').eq(0).attr('src', $('.three_list iframe').eq(0).attr('src'))

            $('.fr_nb iframe').eq(0).attr('src', $('.fr_nb iframe').eq(0).attr('src'))
        });
        // 手机版，是否是移动端设备以及根据浏览器页面宽度（国产浏览器）来判断
        if (navigator.userAgent.match(/mobile/i) && clientWidth <= 1024) {
            $("body").removeClass("old_type").addClass("mobile_type");
            storage.removeItem("mode");
            // 页面的head头部的meta是否有name为viemport标签，如无则添加
            if ($("meta[name=viewport]").attr("content") == null) {
                $('head').prepend('<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">')
            }
            mobileXXGK();
            nbchangesMobile();
        } else {
            $("body").removeClass("mobile_type");

        }
        $('.zhinan').click(function () {
            if (navigator.userAgent.match(/mobile/i) && clientWidth <= 1024) {
                return false;
            } else
                if (!storage.hasOwnProperty("mode")) {
                    $('#gd_1 iframe').eq(0).attr('src', $('#gd_1 iframe').eq(0).attr('src'))

                }
        })

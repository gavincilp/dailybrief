function slidemenu(_this){
$(_this).each(function(){
var $this = $(this);
var theMenu = $this.find(".submenu");
var tarHeight = theMenu.height();
theMenu.css({height:0});
$this.hover(
function(){
$(this).addClass("hover_menu");
theMenu.stop().show().animate({height:tarHeight},300);
},
function(){
$(this).removeClass("hover_menu");
theMenu.stop().animate({height:0},300,function(){
$(this).css({display:"none"});
});
}
);
});
}

<script>

    var mobileLoad = false;//手机加载
    var pcLoad = false;//PC加载
    var laonianLoad = false;//老年加载

    //手机自适应
    (function (doc, win) {
        var docEl = doc.documentElement,
        resizeEvt = 'orientationchange' in window ? 'orientationchange' : 'resize',
        recalc = function () {
          var clientWidth = docEl.clientWidth;
          if (!clientWidth) return;
          if(clientWidth>750){
            docEl.style.fontSize = laonianLoad?'100px':'16px';
            if(!pcLoad){
                loadPc();
            }
          }else{
            docEl.style.fontSize = 100 * (clientWidth / 750) + 'px';
            if(!mobileLoad){
                loadMobile();
            }
          }
        };
      if (!doc.addEventListener) return;
      win.addEventListener(resizeEvt, recalc, false);
      doc.addEventListener('DOMContentLoaded', recalc, false);
    })(document, window);

    //PC加载
    function loadPc () {
        pcLoad = true;
        mobileLoad = false;
    }

    //手机加载
    function loadMobile () {
        mobileLoad = true;
        pcLoad = false;

    }

</script>
